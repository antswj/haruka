AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Haruka - prompt analysis tool (Day 1 skeleton)

Parameters:
  # ONE MODEL, TWO IDENTIFIERS. Probed live 2026-08-12 in ap-northeast-1:
  #
  #   * Claude Haiku 4.5 in Tokyo is INFERENCE_PROFILE only — it has no
  #     ON_DEMAND inference type, so Converse cannot be called on the bare
  #     foundation-model id at all.
  #   * The Japan-domestic profile jp.anthropic.claude-haiku-4-5-... routes
  #     between ap-northeast-1 and ap-northeast-3 and is what Converse needs.
  #   * CountTokens REJECTS that profile —
  #       ValidationException: The provided model doesn't support counting tokens
  #     — and works only on the bare foundation-model id.
  #
  # So the two APIs need two different strings for the same model. This is not
  # duplication that should be collapsed; collapsing it breaks one of the two
  # calls. Each parameter is still referenced everywhere its value is needed
  # (env var AND iam ARN), so a model swap remains a one-line edit per path.
  #
  # Both quoted because the ids end in ":0". Bare YAML would still parse them
  # (a colon only splits a key when a SPACE follows it), but these strings get
  # copy-pasted a lot and one stray space would silently turn one into a
  # nested map. Quotes remove the question.
  CountModelId:
    Type: String
    Default: "anthropic.claude-haiku-4-5-20251001-v1:0"
    Description: >-
      Bare foundation-model id, used ONLY for bedrock:CountTokens. Verified
      live Day 2 (29 EN / 47 JA). Converse rejects this id — Haiku 4.5 has no
      ON_DEMAND inference type in Tokyo.
  JudgeModelId:
    Type: String
    Default: "jp.anthropic.claude-haiku-4-5-20251001-v1:0"
    Description: >-
      Japan-domestic inference profile, used ONLY for Converse (the judge).
      Routes ap-northeast-1 + ap-northeast-3. CountTokens rejects this id with
      ValidationException: The provided model doesn't support counting tokens.

Globals:
  Function:
    # 29, not 10: /analyze makes a real Converse call (up to 1,500 output
    # tokens) on top of a possible cold start, and 10s would time out the
    # Lambda before the judge finished — surfacing as a 502 that blames the
    # model for our own deadline. 29 is the ceiling worth setting: API Gateway
    # cuts the connection at 29s regardless, so anything higher only lets the
    # function keep burning after the caller has already been told it failed.
    Timeout: 29
    # 512, not 128: on Lambda, memory is the CPU dial — you cannot buy cores
    # directly. More CPU means the cold-start import of fastapi/pydantic-core
    # finishes sooner, so the slowest request gets faster even though the
    # function never needs 512 MB of actual memory.
    MemorySize: 512
    Runtime: python3.12
Resources:
  HelloFunction:
    Type: AWS::Serverless::Function
    Properties:
        CodeUri: src/
        # Mangum instance exported by src/app.py, not a raw Lambda function.
        Handler: app.handler
        Environment:
          Variables:
            # Decision 6: zero hardcoded model names in code. The code reads
            # these variables; the template declares their values — so
            # changing models is a template change, not a code change.
            #
            # Two variables because the two Bedrock APIs need two identifiers
            # for the same model (see Parameters). app.py's counting functions
            # read COUNT_MODEL_ID; judge.invoke_judge reads JUDGE_MODEL_ID.
            # Swapping one into the other's call site is a ValidationException,
            # not a silent degradation — which is the good outcome.
            COUNT_MODEL_ID: !Ref CountModelId
            JUDGE_MODEL_ID: !Ref JudgeModelId
            # Without this, tiktoken's first get_encoding() downloads the
            # o200k_base vocabulary from openaipublic.blob.core.windows.net —
            # on every cold start, from inside a Lambda that has no reason to
            # hold outbound internet access. We ship the encoding in the zip
            # (src/tiktoken_cache/) and point tiktoken at it here.
            #
            # /var/task is where Lambda unpacks the deployment package, and
            # CodeUri is src/, so the CONTENTS of src/ land at /var/task —
            # src/tiktoken_cache/ becomes /var/task/tiktoken_cache.
            TIKTOKEN_CACHE_DIR: /var/task/tiktoken_cache
        Policies:
          # Same policy language version the bucket policy declares. Omitting
          # it defaults to 2008-10-17, which behaves identically for a plain
          # Allow but quietly drops policy-variable support if a Condition
          # ever lands here.
          - Version: "2012-10-17"
            Statement:
              # Least privilege, said precisely: TWO actions, on ONE model.
              # Not bedrock:* (which would include model management and every
              # other verb in the service), and not Resource: "*" (which would
              # be every model in the account). This function counts tokens
              # and judges prompts, so those are the only two verbs it holds.
              #
              # THE ACTION FOR CONVERSE IS bedrock:InvokeModel. Verified live
              # 2026-08-12 against the Converse API reference: "This operation
              # requires permission for the bedrock:InvokeModel action."
              # There is NO bedrock:Converse action — Converse is authorised
              # through InvokeModel. (bedrock:InvokeModelWithResponseStream is
              # ConverseStream's; we do not stream, so we do not hold it.)
              #
              # WHY THREE RESOURCES. Invoking through an inference profile
              # needs permission on the profile AND on each foundation model
              # the profile can route to — the profile is a router, not a
              # substitute for the thing it routes to. jp. spans Tokyo and
              # Osaka, so both foundation-model ARNs are required or the call
              # fails in whichever region it happens to land in. That is a
              # wider grant than one ARN, but it is still exactly one model in
              # exactly two regions, with no wildcard anywhere.
              #
              # Note the colon counts differ, and they are not a typo: the
              # inference profile is an ACCOUNT-scoped resource (one colon,
              # then the account id), while foundation models are account-less
              # service resources (two colons).
              #
              # ${AWS::AccountId} rather than the literal account number —
              # same value, same ARN, but the number stays out of a repo that
              # is headed for publication.
              #
              # Regions stay hardcoded on purpose: Japan is locked for all of
              # v1 (§7), and ${AWS::Region} would quietly let a deploy
              # elsewhere succeed against a profile that cannot serve it.
              - Sid: CountAndJudgeOneModelJapanOnly
                Effect: Allow
                Action:
                  - bedrock:CountTokens
                  - bedrock:InvokeModel
                Resource:
                  - !Sub "arn:aws:bedrock:ap-northeast-1:${AWS::AccountId}:inference-profile/${JudgeModelId}"
                  - !Sub "arn:aws:bedrock:ap-northeast-1::foundation-model/${CountModelId}"
                  - !Sub "arn:aws:bedrock:ap-northeast-3::foundation-model/${CountModelId}"
        Events:
          HelloApi:
            Type: HttpApi
            Properties:
              Path: /hello
              Method: get
          CountApi:
            Type: HttpApi
            Properties:
              Path: /count
              # post, not get: the prompt travels in the body. A prompt in a
              # query string would land in API Gateway access logs and in
              # browser history — the privacy claim would be false before
              # the code ever ran.
              Method: post
          AnalyzeApi:
            Type: HttpApi
            Properties:
              Path: /analyze
              # Without this event the route does not exist at the door:
              # API Gateway bounces the request and FastAPI never sees it, so
              # the 404 comes back in API Gateway's shape, not ours. Adding a
              # route to app.py is only half of adding a route.
              Method: post
  # --- Day 2 warm-up: the face. Private bucket, CloudFront the only door. ---

  # No BucketName: CloudFormation names it, so it cannot collide globally.
  # No WebsiteConfiguration: website hosting would make this a custom origin
  # and OAC would stop working.
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # Origin Access Control. SigningBehavior "always" is what forces every
  # CloudFront-to-S3 request to carry a SigV4 signature.
  SiteOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-site-oac"
        Description: Signs CloudFront requests to the Haruka site bucket
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Haruka static site
        DefaultRootObject: index.html
        Origins:
          - Id: SiteS3Origin
            # RegionalDomainName, not DomainName: the non-regional form
            # triggers a 307 redirect that breaks the signature.
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            # Sibling of S3OriginConfig, not nested inside it.
            OriginAccessControlId: !GetAtt SiteOAC.Id
            # Empty string is required by CloudFront when using OAC.
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: SiteS3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
          Compress: true
          # AWS managed policy: CachingOptimized
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6

  # The Condition is the security control: without it, ANY CloudFront
  # distribution in ANY AWS account could read this bucket.
  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontServicePrincipalReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                "AWS:SourceArn": !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution.Id}"

Outputs:
  ApiUrl:
    Description: Where Haruka answers
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/hello"
  SiteDomainName:
    Description: CloudFront domain for the Haruka page (prefix with https://)
    Value: !GetAtt SiteDistribution.DomainName
